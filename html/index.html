<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="utf-8">
      <title>Login Form  
        </title>
   
      <link rel="stylesheet" href="login Design for voting system.css">
 <style>
      * { 
            box-sizing:border-box;
            margin:0;
            padding:0;
            font-family:'Time New Romance',Tahoma,Geneva,Verdana,sans-serif;
        }

        body {
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background:teal;
            padding:20px;}

         .wrapper {
            width:50%;
            text-align:center;}
       
        .main-title {
            color:#ADD8E6;
            margin-bottom:25px;}

        .login-card {
            background-color:rgba(5,30,30,1);
            border-radius:12px;
            padding:40px 35px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align:left;}

         h2 {
            color:#87CEFA;
            text-align:center;
            font-size:20px;
            font-weight:600;
            margin-bottom:8px;}

        .subtitle {
            color:#7fa19c;
            text-align:center;
            font-size:14px;
            margin-bottom:30px;}
        
        .form-group {
            margin-bottom:20px;}

         label {
            display:block;
            color:#e0e0e0;
            font-size:14px;
            margin-bottom:10px;}
        
         input[type="text"],input[type="password"] {
            width:100%;
            padding:12px 15px;
            border:1px solid white;
            border-radius:6px;
            font-size:14px;
           // outline:none;
            color:black;}
        
        //.form-group input::placeholder {
            color:black;}
              
        .login-btn {
            width:100%;
            background-color:blue;
            color:white;
            border:none;
            padding:14px;
            border-radius:6px;
            font-size:16px;
            font-weight:500;
            //cursor:pointer;
           // transition:background-color 0.2s ease;
            margin-bottom:25px;}
        
        .login-btn:hover {
            background-color:skyblue;}

        .footer-text {
            text-align:center;
            color:white;
            font-size:14px;}
        
        .footer-text a {
            color: #0084b4;
            text-decoration:none;}

        .footer-text a:hover {
            text-decoration:underline;}
        
  </style>
  
  </head>
 <body>

    <div class="wrapper">
        <h1 class="main-title">Please Login to vote for your favorite</h1>
  <div class="login-card">
        <h2>Sign in</h2>
            <p class="subtitle">Sign in with your username and password</p>
            
            <form method="get">
                <div class="form-group">
                    <label for="username">Your username</label><br>
                    <input type="text" id="username" placeholder="Enter Username" required>
                </div>
               
                <div class="form-group">
                    <label for="password">Your password</label><br>
                    <input type="password" id="password" placeholder="Enter Password" required>
                </div>
                <br>      
                <button type="submit" class="login-btn">Login</button>
                <div class="footer-text">Not a member?
                    <a href="Register.html">Register here!</a>
                </div>
            </form>
        </div>
    </div>

  </body>
</html>
