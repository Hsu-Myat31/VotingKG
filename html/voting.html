<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

       
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1b5374 0%, #206c5c 50%, #4c966c 100%);
        }

        <label>Your username</label>
                <input type="text" placeholder="Enter Username" required>
            </div>

            <div class="input-group">
                <label>Your password</label>
                <input type="password" placeholder="Enter Password" required>
            </div>

            <div class="flex-row">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="register-text">Not a member?<a href="#">Register here!</a></p>
    </div>

</body>
</html>
        .login-card {
            background-color: rgba(18, 38, 32, 0.9); /* မှောင်မှောင်အစိမ်းပုပ်ရောင် */
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        /* Sign in ခေါင်းစဉ် */
        .login-card h2 {
            color: #ffffff;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #70857d;
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }
/
        .input-group label {
            display: block;
            color: #a3b8b0;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 4px;
            background-color: #ffffff;
            font-size: 14px;
            outline: none;
        }

       
        .input-group input::placeholder {
            color: #b0b0b0;
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .remember-me {
            color: #a3b8b0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .forgot-link {
            color: #2b7099;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

       
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #050b09;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 25px;
        }

        .login-btn:hover {
            background-color: #111a17;
        }

       
        .register-text {
            text-align: center;
            color: #a3b8b0;
            font-size: 13px;
        }

        .register-text a {
            color: #2b7099;
            text-decoration: none;
            margin-left: 3px;
        }

        .register-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Sign in</h2>
        <p class="subtitle">Sign in with your username and password</p>

        <form action="#">
            <div class="input-group">
<label>Your username</label>
                <input type="text" placeholder="Enter Username" required>
            </div>

            <div class="input-group">
                <label>Your password</label>
                <input type="password" placeholder="Enter Password" required>
            </div>

            <div class="flex-row">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="register-text">Not a member?<a href="#">Register here!</a></p>
    </div>

</body>
</html>
