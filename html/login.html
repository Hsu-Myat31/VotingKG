<!DOCTYPE html>
 <html lang="en">
  <head>
    <title> Voting system </title>
           <meta charset= "utf-8">
    <style>
        body {
            background-color:teal;
            color:white;
            font-family:'Times New Roman';
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:20px;
            margin:0;
            }
        
        .container {
            text-align:center;
            max-width:500px;
            width:100%;
            }

        #div1 { 
            font-color:white;
            font-size:35px;
            font-weight:bold;
            margin-bottom:10px;
           }
        #div2 { 
            font-color:white;
            font-weight:bold; 
            font-size:22px;
            margin-bottom:30px; 
           }
        #div3 { 
            font-color:black;
            font-weight:bold;
            font-size:18px; 
            margin-bottom:30px;
           }
        #div4 { 
            font-color:white;
            font-weight:bold; 
            font-size:22px;
            margin-bottom:20px; 
           }
        #div5 { 
            font-color:white;
            font-weight:bold; 
            font-size:22px;
            margin-bottom:20px; 
           }
        #div6 { 
            font-size:30px; 
            font-weight:bold; 
            margin-top:25px;
           }

        input[type="text"], input[type="password"] {
            width:70%;
            padding:10px;
            border:2px solid white;
            border-radius:20px;
            outline:none;
            margin-bottom:20px;
            display:inline-block;
        }

        input[type="submit"] {
            background-color:black;
            color:white;
            border:2px solid black;
            padding:12px 167px;
            font-size:20px;
            border-radius:30px;
            cursor:pointer;
            font-weight:bold;
            margin-top:10px;
        }
    </style>
  </head>
<body>
    <div class="container">
        <h1>Login to vote your favourite stars</h1>
        <br>
        <h2>Sign in</h2>
        <h3>Sign in with your username and password</h3>
        <h4>Your username</h4>
        <input type="text" name="Enter username" id="Enter username">
        <h5>Your password</h5>
        <input type="password" name="password" id="password">
        <br>
        <input type="submit" name="Login" value="Login">
        <br>
        <h6>Not a member?Register here!</h6>
    </div>
  </body>
</html>
